source: data/rabbit/cohort
target: data/rabbit/T90.obj
output_dir: outputs/rabbit_encoder_cohort_so3_test

field:
  kind: stationary
  num_steps: 10
  width: 256
  activation: relu
  fa: [64, 64, 64]
  df: [256, 256, 256, 256, 256]
  fourier_n_e: 3

code:
  kind: encoder
  conditioning_method: concat
  n_z: 10

  # Encoder configuration (equivariant graph neural network)
  encoder_config:
    latent_dim: 10
    readout: mean
    readout_heads: 1
    supernode_sh_lmax: 3
    transformer_type: equiformer
    transformer_cfg:    
      num_layers: 2
      num_heads: 2
      num_channels: 8
      lmax: 2
    area_pool: true
    latent_mode: deterministic
    verbose: false

    # Equivariant layer stack
    layers:
      - in_irreps: "1x0e"
        target_irreps: "32x0e + 16x1e"
        spatial_sh_lmax: 1
        interaction_sh_lmax: 3

      - in_irreps: "32x0e + 16x1e"
        target_irreps: "64x0e + 32x1e"
        spatial_sh_lmax: 2
        interaction_sh_lmax: 3

  # Graph construction configuration
  graph_spec:
    r_max: 0.1
    r_supergraph: 0.3
    dropout_rate: 0.1
    use_supernodes: true
    n_supernodes: 10
    sampling_mode_supernodes: fps
    sampling_mode_graph: uniform
    recompute_area: true
    area_k: 8
    noise_std: 0.0

augmentation:
  kind: so3
  seed: 42

use_encoder_pose: true

loss:
  data_name: chamfer
  data_kwargs: {}
  direction: forward
  sigma: 0.0001
  kinetic_weight: 1.0
  code_reg_weight: 0.0
  weight_decay: 0.0001
  isometry_weight: 0.0
  isometry_type: strain
  isometry_samples: 64
  subsample_M: 2000

train:
  mode: cohort
  steps: 10001
  batch: 2
  lr: 0.0001
  seed: 42
  log_every: 50
  save_every: 500
  val_every: 0
  export_shapes: 2
  export_strategy: sequential
