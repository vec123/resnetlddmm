source: data/rabbit/cohort
target: data/rabbit/T90.obj
output_dir: outputs/rabbit_encoder_cohort

field:
  kind: time_varying
  num_steps: 10
  width: 512
  activation: relu
  fa: [64, 64, 64]
  df: [256, 256, 256, 256, 256]
  fourier_n_e: 3

code:
  kind: encoder
  n_z: 256

  # Encoder configuration (equivariant graph neural network)
  encoder_config:
    latent_dim: 256
    readout: mean
    readout_heads: 1
    supernode_sh_lmax: 4
    transformer_type: se3
    transformer_cfg: {}
    area_pool: false
    latent_mode: gaussian
    verbose: false

    # Equivariant layer stack
    layers:
      - in_irreps: "1x0e"
        target_irreps: "32x0e + 32x0o + 16x1e + 16x1o"
        spatial_sh_lmax: 1
        interaction_sh_lmax: 4

      - in_irreps: "32x0e + 32x0o + 16x1e + 16x1o"
        target_irreps: "64x0e + 32x0o + 32x1e + 16x1o"
        spatial_sh_lmax: 2
        interaction_sh_lmax: 4

  # Graph construction configuration
  graph_spec:
    r_max: 0.1
    r_supergraph: 0.2
    dropout_rate: 0.8
    use_supernodes: false
    n_supernodes: 10
    sampling_mode_supernodes: fps
    sampling_mode_graph: uniform
    recompute_area: false
    area_k: 8
    noise_std: 0.0

loss:
  data_name: chamfer
  data_kwargs: {}
  direction: bidirectional
  sigma: 0.1
  kinetic_weight: 1.0
  code_reg_weight: 0.0
  weight_decay: 0.0001
  isometry_weight: 0.0
  isometry_type: strain
  isometry_samples: 64
  subsample_M: 2000
  subsample_a: 0.15

train:
  mode: cohort
  steps: 2000
  batch: 4
  subsample: 0
  lr: 0.0001
  seed: 42
  log_every: 50
  save_every: 500
  val_every: 0
  export_shapes: 2
  export_strategy: sequential
