# Proof-of-concept: hand pair registration with isometry constraint
# Same as hand_pair_poc but with isometry regularization enabled

source: data/ultrasound/test_face.vtp
target: data/ultrasound/1-03.vtp
output_dir: ./outputs/ultrasound_poc_unidir_test_face_03

field:
  kind: stationary
  num_steps: 10
  width: 246
  activation: relu
  
code:
  kind: none
  position_aware: true
  conditioning_method: concat
  grid: 8

loss:
  data_name: chamfer
  sigma: 0.2
  kinetic_weight: 0.0
  code_reg_weight: 0.0
  isometry_weight: 0.0
  isometry_type: det
  subsample_M: 200
  save_full: false
  direction: forward

train:
  mode: pair
  steps: 2000
  batch: 4

  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 100
  val_every: 0
  export_shapes: 2
  export_strategy: sequential

