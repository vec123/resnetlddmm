# Rabbit cohort + encoder pose + L2 flow-equivariance term.
#
# Run:  python -m src.resnet_lddmm.cli configs/rabbit_cohort_equivariance.yaml
#
# The encoder predicts a pose g from each SO(3)-augmented sample. Two objectives
# act on it at once:
#   data              chamfer( g.phi(T), augmented_sample )   -- the existing fit
#   flow_equivariance || phi(g.T) - g.phi(T) ||^2             -- the flow must
#                                                                commute with g
#
# Note the flow is NOT frozen here: with freeze_flow_at_identity the equivariance
# term is exactly 0, since the identity commutes with every group element. A live
# flow is what gives the term something to constrain.

source: data/rabbit/cohort   # 3 shapes
target: data/rabbit/T90.obj            # template the flow starts from
output_dir: outputs/rabbit_cohort_equivariance_rot_penalty

field:
  kind: stationary                     # MLP field: equivariance is a real constraint
  num_steps: 10                        # K, the integration steps
  width: 256
  activation: relu
  fa: [64, 64, 64]
  df: [256, 256, 256, 256, 256]
  fourier_n_e: 3

code:
  kind: encoder
  conditioning_method: concat
  n_z: 10                              # must equal encoder_config.latent_dim

  encoder_config:
    latent_dim: 10
    readout: mean
    readout_heads: 1
    supernode_sh_lmax: 3
    transformer_type: equiformer
    transformer_cfg:
      num_layers: 2
      num_heads: 2
      num_channels: 8
      lmax: 2
    area_pool: true
    latent_mode: deterministic
    verbose: false

    layers:
      - in_irreps: "1x0e"
        target_irreps: "32x0e + 16x1o"
        spatial_sh_lmax: 2
        interaction_sh_lmax: 3

      - in_irreps: "32x0e + 16x1o"
        target_irreps: "64x0e + 32x1o"
        spatial_sh_lmax: 2
        interaction_sh_lmax: 3

  graph_spec:
    r_max: 0.1
    r_supergraph: 0.3
    dropout_rate: 0.0
    use_supernodes: true
    n_supernodes: 10
    sampling_mode_supernodes: fps
    sampling_mode_graph: uniform
    recompute_area: true
    area_k: 8
    noise_std: 0.0

augmentation:
  kind: so3                            # random rotation per sample, per step
  seed: 42

use_encoder_pose: true                 # apply the predicted pose to the flow output
freeze_flow_at_identity: false         # keep the flow live (see header note)

loss:
  data_name: chamfer
  data_kwargs: {}
  direction: forward                   # encoder pose requires unidirectional
  sigma: 0.0001                          # data weight = 1/(2*sigma^2) = 200
  kinetic_weight: 5
  code_reg_weight: 0.0
  weight_decay: 0.0001
  isometry_weight: 0.0
  isometry_type: strain
  isometry_samples: 64
  subsample_M: 0                       # mesh is 252 verts; anything >=252 is a no-op

  # || phi(g.T) - g.phi(T) ||^2. 
  equivariant_deformation_weight: 0.00
  equivariant_deformation_kwargs:
    # true  -> gradient reaches the VELOCITY FIELD only: both g and the latent code z
    # are constants, so nothing flows back to the encoder. Costs one extra integration
    # (3 per step total), since the data term's trajectory carries encoder gradient
    # through z and cannot be reused. The loss value is unchanged either way.
    # false -> the constraint also reaches the latent and the pose head. Caution: the
    # term is trivially zero at g = identity, so it can then be minimised by driving R
    # toward I instead of by making the flow equivariant -- which fights the data term.
    field_only: true
    # Include the predicted translation in g.
    translation: false

  # || R_hat - R_aug ||_F^2 against the rotation SO3Augmentation actually drew.
  # The only genuinely SUPERVISED pose signal here: 
  # Only available because the pose is SYNTHETIC; it teaches the encoder to undo the
  # augmenter, not to handle real pose variation in held-out data.
  # Kept at a token weight so it MONITORS without training: read it as
  # 8*sin^2(theta/2), so 0 = exact, 6 = chance, 8 = 180 degrees off.
  pose_supervision_weight: 0.0000001
  pose_supervision_kwargs:
    translation: false                 # SO(3) augmentation draws none; see above

  # || R_flow - I ||_F^2, where R_flow = Procrustes(T, phi(T)) is the net rigid
  # rotation the DEFORMATION applies. Fixes the pose/deformation gauge.
  #
  # The data term only ever sees the product phi(T) @ R_hat, so (phi(T)@A, A^-1 @ R_hat)
  # predicts identical points for any rotation A -- a 3-parameter family of equally
  # optimal answers, from which training picks one arbitrarily. That is why
  # pose_supervision_loss sits flat at ~6: with R_hat = A^-1 R_aug the augmentation
  # cancels, leaving the constant ||A^-1 - I||_F^2. This term is the only one that can
  # see the split, because it looks at phi(T) alone rather than at the product.
  # Driving R_flow -> I selects A = I, so R_hat carries the whole pose and
  # pose_supervision_loss should fall from ~6 toward 0.
  #
  # Weight: the data term is EXACTLY flat along the gauge, so any value > 0 selects
  # A = I unopposed -- it only sets how fast. Keep it a tie-breaker, not a competitor.
  # Check: raise it 10x; if `data` does not move, it is acting only on flat directions
  # and cannot be distorting real geometry.
  flow_rotation_penalty_weight: 1.0

train:
  mode: cohort
  steps: 5000
  batch: 3                             # = cohort size
  lr: 0.001
  seed: 42
  log_every: 25
  save_every: 100
  val_every: 0
  export_shapes: 2
  export_strategy: sequential
