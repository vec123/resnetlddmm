# Rabbit cohort + encoder pose + L2 flow-equivariance term.
#
# Run:  python -m src.resnet_lddmm.cli configs/rabbit_cohort_equivariance.yaml
#
# The encoder predicts a pose g from each SO(3)-augmented sample. Two objectives
# act on it at once:
#   data              chamfer( g.phi(T), augmented_sample )   -- the existing fit
#   flow_equivariance || phi(g.T) - g.phi(T) ||^2             -- the flow must
#                                                                commute with g
#
# Note the flow is NOT frozen here: with freeze_flow_at_identity the equivariance
# term is exactly 0, since the identity commutes with every group element. A live
# flow is what gives the term something to constrain.

source: data/rabbit/identical_cohort   # 3 shapes
target: data/rabbit/T90.obj            # template the flow starts from
output_dir: outputs/rabbit_cohort_equivariance

field:
  kind: stationary                     # MLP field: equivariance is a real constraint
  num_steps: 10                        # K, the integration steps
  width: 256
  activation: relu
  fa: [64, 64, 64]
  df: [256, 256, 256, 256, 256]
  fourier_n_e: 3

code:
  kind: encoder
  conditioning_method: concat
  n_z: 10                              # must equal encoder_config.latent_dim

  encoder_config:
    latent_dim: 10
    readout: mean
    readout_heads: 1
    supernode_sh_lmax: 3
    transformer_type: equiformer
    transformer_cfg:
      num_layers: 2
      num_heads: 2
      num_channels: 8
      lmax: 2
    area_pool: true
    latent_mode: deterministic
    verbose: false

    layers:
      - in_irreps: "1x0e"
        target_irreps: "32x0e + 16x1o"
        spatial_sh_lmax: 2
        interaction_sh_lmax: 3

      - in_irreps: "32x0e + 16x1o"
        target_irreps: "64x0e + 32x1o"
        spatial_sh_lmax: 2
        interaction_sh_lmax: 3

  graph_spec:
    r_max: 0.1
    r_supergraph: 0.3
    dropout_rate: 0.0
    use_supernodes: true
    n_supernodes: 10
    sampling_mode_supernodes: fps
    sampling_mode_graph: uniform
    recompute_area: true
    area_k: 8
    noise_std: 0.0

augmentation:
  kind: so3                            # random rotation per sample, per step
  seed: 42

use_encoder_pose: true                 # apply the predicted pose to the flow output
freeze_flow_at_identity: false         # keep the flow live (see header note)

loss:
  data_name: chamfer
  data_kwargs: {}
  direction: forward                   # encoder pose requires unidirectional
  sigma: 0.05                          # data weight = 1/(2*sigma^2) = 200
  kinetic_weight: 0.01
  code_reg_weight: 0.0
  weight_decay: 0.0001
  isometry_weight: 0.0
  isometry_type: strain
  isometry_samples: 64
  subsample_M: 0                       # mesh is 252 verts; anything >=252 is a no-op

  # || phi(g.T) - g.phi(T) ||^2. Strictly > 0 to be computed at all: at 0 the term
  # is never built and its extra forward integration never runs. Appears in the
  # logged breakdown as `equivariant_deformation_loss` at its RAW, unweighted value.
  equivariant_deformation_weight: 1.0
  equivariant_deformation_kwargs:
    detach_group: true                 # train the field, don't push the pose head
    translation: true                  # include predicted translation in g

train:
  mode: cohort
  steps: 500
  batch: 3                             # = cohort size
  lr: 0.001
  seed: 42
  log_every: 25
  save_every: 100
  val_every: 0
  export_shapes: 2
  export_strategy: sequential
