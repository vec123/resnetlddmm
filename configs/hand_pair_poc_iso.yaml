# Proof-of-concept: hand pair registration with isometry constraint
# Same as hand_pair_poc but with isometry regularization enabled

source: data/hand/template.vtp
target: data/hand/target_3.vtp
output_dir: ./outputs/hand_pair_poc_iso_111

field:
  kind: time-varying
  num_steps: 10
  width: 512
  activation: relu

code:
  kind: none

loss:
  data_name: chamfer
  data_kwargs: {}
  #  p: 1
  #  blur: 0.01
  #  backend: auto
  sigma: 10
  kinetic_weight: 0.000001
  code_reg_weight: 0.0
  isometry_weight: 100
  isometry_type: det
  isometry_samples: 12  

train:
  mode: pair
  steps: 5000
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 100
