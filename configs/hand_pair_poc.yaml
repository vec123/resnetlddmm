# Proof-of-concept: hand pair registration (STEP T17)
# Registers two copies of the hand template (same geometry, tests correctness)
# Use as template: adjust source/target paths and output_dir for your data

source: data/hand/template.vtp
target: data/hand/target_3.vtp
output_dir: ./outputs/hand_pair_poc_target_3_bidir

# Field: velocity field (time_varying or stationary)
# For stationary: use kind: stationary (same f(x) at all time steps; use num_steps for integration steps)
field:
  kind: stationary
  num_steps: 20
  width: 512
  activation: relu

# Code: no additional shape code (registration only)
code:
  kind: none


# Loss: EMD (Earth Mover's Distance) for articulated shapes + kinetic energy
loss:
  data_name: chamfer
  data_kwargs: {}
    #p: 2
   # blur: 0.01
   # backend: auto
  direction: bidirectional
  sigma: 0.0002
  kinetic_weight: 0.005
  code_reg_weight: 0.0
  isometry_weight: 0.0
  isometry_type: det

# Training: 500 steps with Adam at lr=1e-4, seed for reproducibility
train:
  mode: pair
  steps: 3000
  lr: 0.00001
  seed: 42
  log_every: 50
  save_every: 500
