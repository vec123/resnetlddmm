# Ablation: Time-varying field, auto-decoder codes (Phase 9 free ablation)
# Matrix cell [time-varying, conditioned on z]
# Reference: IMPLEMENTATION_PLAN.md §1 Table, §1.4 invariant 1
# Orthogonal axes: time-dependence and code-conditioning are independent.
# This cell was reserved as a valid config combination at design time.

source: data/rabbit/cohort
target: data/rabbit/T90.obj
output_dir: outputs/ablation_time_varying_auto_decoder

field:
  kind: time_varying
  num_steps: 10
  width: 512
  activation: relu

code:
  kind: auto_decoder
  n_z: 256
  conditioning: FiLM
  grid: 2
  grid_channels: 32

loss:
  data_name: chamfer
  data_kwargs: {}
  direction: bidirectional
  sigma: 0.1
  kinetic_weight: 1.0
  code_reg_weight: 0.01
  weight_decay: 0.0001
  isometry_weight: 0.0
  isometry_type: strain
  subsample_M: 2000
  subsample_a: 0.15

train:
  mode: cohort
  steps: 2000
  batch: 4
  subsample: 0
  lr: 0.0001
  seed: 42
  log_every: 50
  save_every: 500
  val_every: 0
  export_shapes: 2
  export_strategy: sequential
